services:
  app:
      build: .
      container_name: http-practice-app
      image: http-practive:latest
      ports: 
      - "8080:8080"
      environment:
        DATABASE_URL: postgres://user:pass@db:5432/app?sslmode=disable
      depends_on:
        db:
          condition: service_healthy
  db:
    image: postgres:16
    container_name: http-practice-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d app"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
    pgdata:
